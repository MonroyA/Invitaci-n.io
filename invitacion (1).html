<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una invitación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --navy-950:#0a0c1f;
    --navy-900:#111536;
    --navy-800:#1a1f47;
    --navy-700:#262c5e;
    --lavender-300:#d7c9f2;
    --lavender-400:#c1abe8;
    --lavender-500:#a78bd6;
    --mist:#f3eefb;
    --mist-dim:rgba(243,238,251,0.62);
    --line:rgba(215,201,242,0.28);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    height:100%;
    background:var(--navy-950);
    color:var(--mist);
    font-family:'Jost',sans-serif;
    overflow:hidden;
  }

  button{font-family:inherit;}

  /* ---------- INTRO ---------- */
  #intro{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy-950);
    z-index:50;
    transition:opacity 1.1s ease, visibility 1.1s ease;
  }
  #intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  #intro svg{
    width:min(52vw, 340px);
    height:auto;
    overflow:visible;
  }
  .infinity-path{
    fill:none;
    stroke:url(#infGradient);
    stroke-width:3.5;
    stroke-linecap:round;
    stroke-dasharray:640;
    stroke-dashoffset:640;
    animation:draw 6s cubic-bezier(.65,0,.35,1) forwards;
    filter:drop-shadow(0 0 8px rgba(193,171,232,0.45));
  }
  @keyframes draw{
    0%{stroke-dashoffset:640;}
    85%{stroke-dashoffset:0;}
    100%{stroke-dashoffset:0;}
  }

  /* ---------- MAIN ---------- */
  #main{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    transition:opacity 1.4s ease;
  }
  #main.show{opacity:1;}

  .echo-layer{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
  }
  .echo-wrap{
    position:absolute;
    top:50%;
    left:50%;
    width:60vw;
    max-width:640px;
    transform:translate(-50%,-50%) scale(0.22);
    opacity:0;
    filter:blur(85px);
    transition:transform 2.1s cubic-bezier(.22,.61,.36,1), opacity 1.8s ease;
  }
  #main.show .echo-wrap{
    opacity:0.5;
  }
  #main.show .echo-a{
    transform:translate(-118%,-88%) scale(1.15);
  }
  #main.show .echo-b{
    transform:translate(18%,58%) scale(1.3);
  }
  .echo-drift{
    display:block;
    width:100%;
    height:auto;
  }
  .echo-drift.a{
    animation:driftA 24s ease-in-out infinite;
  }
  .echo-drift.b{
    animation:driftB 28s ease-in-out infinite;
  }
  @keyframes driftA{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(2.5%,3%) scale(1.05);}
  }
  @keyframes driftB{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-3%,-2.5%) scale(1.07);}
  }

  .card{
    position:relative;
    width:min(90vw, 560px);
    padding:0 24px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .mark{
    width:56px;
    height:auto;
    margin-bottom:28px;
    opacity:0.85;
  }
  .mark path{
    fill:none;
    stroke:var(--lavender-400);
    stroke-width:5;
    stroke-linecap:round;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--lavender-300);
    margin-bottom:18px;
    font-weight:400;
  }

  .headline{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:clamp(30px, 5vw, 44px);
    line-height:1.25;
    color:var(--mist);
    margin-bottom:20px;
  }
  .headline em{
    font-style:italic;
    color:var(--lavender-300);
  }

  .body-text{
    font-size:15px;
    line-height:1.85;
    color:var(--mist-dim);
    font-weight:300;
    max-width:440px;
    margin-bottom:40px;
    transition:opacity .5s ease;
  }
  .body-text.fade{opacity:0;}

  .divider{
    width:36px;
    height:1px;
    background:var(--line);
    margin:0 0 32px;
  }

  .actions{
    display:flex;
    gap:18px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .actions.hidden{
    opacity:0;
    transform:translateY(6px);
    pointer-events:none;
    position:absolute;
  }

  .btn{
    position:relative;
    appearance:none;
    border:1px solid var(--line);
    background:transparent;
    color:var(--mist);
    padding:13px 38px;
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    border-radius:999px;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .35s ease, border-color .35s ease, color .35s ease;
    overflow:hidden;
  }
  .btn:focus-visible{
    outline:2px solid var(--lavender-400);
    outline-offset:3px;
  }
  .btn:active{
    transform:scale(0.94);
  }
  .btn-yes{
    background:linear-gradient(135deg, var(--lavender-500), var(--navy-700));
    border-color:transparent;
  }
  .btn-yes:hover{
    box-shadow:0 0 24px rgba(193,171,232,0.4);
    transform:translateY(-1px);
  }
  .btn-no{
    color:var(--mist-dim);
  }
  .btn-no:hover{
    border-color:var(--lavender-400);
    color:var(--mist);
  }

  /* subtle sparkle burst on the "Sí" button */
  .spark{
    position:absolute;
    inset:0;
    border-radius:999px;
    background:radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(215,201,242,0.5) 40%, transparent 72%);
    opacity:0;
    transform:scale(0.4);
    pointer-events:none;
  }
  .spark.play{
    animation:sparkBurst .7s ease-out;
  }
  @keyframes sparkBurst{
    0%{opacity:0.9; transform:scale(0.4);}
    100%{opacity:0; transform:scale(2.4);}
  }

  /* soft full-screen glint when confirming */
  .glint{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at 50% 62%, rgba(215,201,242,0.35), transparent 55%);
    opacity:0;
    pointer-events:none;
    z-index:40;
  }
  .glint.play{
    animation:glintFade 1s ease-out;
  }
  @keyframes glintFade{
    0%{opacity:0;}
    30%{opacity:1;}
    100%{opacity:0;}
  }

  .reveal{
    opacity:0;
    transition:opacity .8s ease .3s;
  }
  .reveal.show{opacity:1;}

  /* ---------- FAREWELL ---------- */
  #farewell{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--navy-950);
    opacity:0;
    visibility:hidden;
    transition:opacity .8s ease, visibility .8s ease;
    z-index:60;
    text-align:center;
    padding:0 32px;
  }
  #farewell.show{opacity:1;visibility:visible;}
  #farewell p{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(26px, 5vw, 40px);
    color:var(--lavender-300);
    opacity:0;
    transition:opacity 1.6s ease;
  }
  #farewell p.in{opacity:1;}
  #farewell p.out{opacity:0;}

  @media (prefers-reduced-motion: reduce){
    .infinity-path{animation:none; stroke-dashoffset:0;}
    .echo-drift.a, .echo-drift.b{animation:none;}
    .echo-wrap{transition:opacity 1.8s ease;}
    #intro{transition:none;}
  }
</style>
</head>
<body>

<!-- INTRO: infinity forming -->
<div id="intro">
  <svg viewBox="0 0 400 200">
    <defs>
      <linearGradient id="infGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#d7c9f2"/>
        <stop offset="100%" stop-color="#8f7ac9"/>
      </linearGradient>
    </defs>
    <path class="infinity-path" d="M200,100
      A50,50 0 0,1 150,50 A50,50 0 0,1 100,100 A50,50 0 0,1 150,150 A50,50 0 0,1 200,100
      A50,50 0 0,0 250,50 A50,50 0 0,0 300,100 A50,50 0 0,0 250,150 A50,50 0 0,0 200,100 Z"/>
  </svg>
</div>

<!-- MAIN -->
<div id="main">
  <div class="echo-layer">
    <div class="echo-wrap echo-a">
      <svg class="echo-drift a" viewBox="0 0 400 200">
        <defs>
          <linearGradient id="echoGradA" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3a4180"/>
            <stop offset="100%" stop-color="#1a1f47"/>
          </linearGradient>
        </defs>
        <path fill="url(#echoGradA)" d="M200,100
          A50,50 0 0,1 150,50 A50,50 0 0,1 100,100 A50,50 0 0,1 150,150 A50,50 0 0,1 200,100
          A50,50 0 0,0 250,50 A50,50 0 0,0 300,100 A50,50 0 0,0 250,150 A50,50 0 0,0 200,100 Z"/>
      </svg>
    </div>
    <div class="echo-wrap echo-b">
      <svg class="echo-drift b" viewBox="0 0 400 200">
        <defs>
          <linearGradient id="echoGradB" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c1abe8"/>
            <stop offset="100%" stop-color="#8f7ac9"/>
          </linearGradient>
        </defs>
        <path fill="url(#echoGradB)" d="M200,100
          A50,50 0 0,1 150,50 A50,50 0 0,1 100,100 A50,50 0 0,1 150,150 A50,50 0 0,1 200,100
          A50,50 0 0,0 250,50 A50,50 0 0,0 300,100 A50,50 0 0,0 250,150 A50,50 0 0,0 200,100 Z"/>
      </svg>
    </div>
  </div>

  <div class="card">
    <svg class="mark" viewBox="0 0 400 200">
      <path d="M200,100
        A50,50 0 0,1 150,50 A50,50 0 0,1 100,100 A50,50 0 0,1 150,150 A50,50 0 0,1 200,100
        A50,50 0 0,0 250,50 A50,50 0 0,0 300,100 A50,50 0 0,0 250,150 A50,50 0 0,0 200,100 Z"/>
    </svg>

    <p class="eyebrow" id="eyebrow">Una invitación</p>

    <p class="body-text" id="bodyText">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.</p>

    <div class="divider"></div>

    <div class="actions" id="actions">
      <button class="btn btn-no" id="btnNo">No</button>
      <button class="btn btn-yes" id="btnYes">Sí<span class="spark" id="spark"></span></button>
    </div>
  </div>
</div>

<div class="glint" id="glint"></div>

<!-- FAREWELL on "No" -->
<div id="farewell">
  <p id="farewellText">Feliz cumpleaños, que disfrutes tu día.</p>
</div>

<script>
  /* ======= CONFIGURA TU EMAILJS AQUÍ (gratis, sin tarjeta) =======
     1. Crea cuenta en https://www.emailjs.com/ (plan gratis: 200 correos/mes)
     2. Agrega un "Email Service" (ej. Gmail) -> copia el SERVICE_ID
     3. Crea un "Email Template" con variables {{response}} y {{time}} -> copia el TEMPLATE_ID
     4. En "Account" copia tu "Public Key"
     5. Reemplaza los 3 valores de abajo
  ================================================================ */
  const EMAILJS_PUBLIC_KEY  = "Pm0Sp0uOjx-nXGFmZ";
  const EMAILJS_SERVICE_ID  = "service_fmg9uat";
  const EMAILJS_TEMPLATE_ID = "template_gk4c3pl";

  if (window.emailjs) {
    emailjs.init(EMAILJS_PUBLIC_KEY);
  }

  function notifyResponse(response){
    if (!window.emailjs) return; // el script de EmailJS no cargó (ej. sin conexión)
    const isYes = response === 'Sí';
    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      title: isYes ? 'Respondió: Sí ✅' : 'Respondió: No',
      name: "Invitación web",
      message: isYes
        ? 'Tu invitado presionó "Sí". ¡Confirmó la cena!'
        : 'Tu invitado presionó "No".',
      time: new Date().toLocaleString('es-GT')
    }).catch(err => console.error("EmailJS:", err));
  }
</script>

<script>
  const intro = document.getElementById('intro');
  const main = document.getElementById('main');
  const bodyText = document.getElementById('bodyText');
  const eyebrow = document.getElementById('eyebrow');
  const actions = document.getElementById('actions');
  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  const farewell = document.getElementById('farewell');
  const farewellText = document.getElementById('farewellText');
  const spark = document.getElementById('spark');
  const glint = document.getElementById('glint');

  const INVITE_TEXT = bodyText.textContent;
  const REVEAL_TEXT = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus lacinia odio vitae vestibulum vestibulum. Cras venenatis euismod malesuada. Curabitur non nulla sit amet nisl tempus convallis quis ac lectus.";

  // Show main screen after the 6s intro animation
  window.addEventListener('load', () => {
    setTimeout(() => {
      intro.classList.add('hide');
      main.classList.add('show');
    }, 6000);
  });

  btnYes.addEventListener('click', () => {
    notifyResponse('Sí');

    spark.classList.remove('play');
    void spark.offsetWidth; // restart animation
    spark.classList.add('play');

    glint.classList.remove('play');
    void glint.offsetWidth;
    glint.classList.add('play');

    bodyText.classList.add('fade');
    eyebrow.style.transition = 'opacity .5s ease';
    eyebrow.style.opacity = '0';

    setTimeout(() => {
      bodyText.textContent = REVEAL_TEXT;
      eyebrow.textContent = 'Confirmado';
      bodyText.classList.remove('fade');
      eyebrow.style.opacity = '1';
      actions.classList.add('hidden');
    }, 500);
  });

  btnNo.addEventListener('click', () => {
    notifyResponse('No');

    farewell.classList.add('show');
    requestAnimationFrame(() => {
      setTimeout(() => farewellText.classList.add('in'), 50);
    });

    setTimeout(() => {
      farewellText.classList.remove('in');
      farewellText.classList.add('out');
    }, 2600);

    setTimeout(() => {
      window.close();
      // Fallback if the browser blocks window.close() (page wasn't opened by script)
      document.body.style.background = '#0a0c1f';
    }, 3600);
  });
</script>

</body>
</html>
